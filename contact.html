<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | REMIX.io</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">REMIX.io</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        <div class="container py-5 my-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-lg overflow-hidden">
                        <div class="row g-0">
                            <div class="col-md-4 bg-primary text-white p-5 d-flex flex-column justify-content-center">
                                <h3 class="fw-bold mb-4">Let's Connect</h3>
                                <div class="d-flex mb-3">
                                    <i class="bi bi-geo-alt me-3"></i>
                                    <p class="mb-0">123 Tech Lane, Silicon Valley</p>
                                </div>
                                <div class="d-flex mb-3">
                                    <i class="bi bi-envelope me-3"></i>
                                    <p class="mb-0">hello@remix.io</p>
                                </div>
                                <div class="d-flex">
                                    <i class="bi bi-telephone me-3"></i>
                                    <p class="mb-0">+1 (555) 000-1111</p>
                                </div>
                            </div>
                            <div class="col-md-8 p-5 bg-white">
                                <form id="contactForm">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-bold">First Name</label>
                                            <input type="text" class="form-control bg-light border-0" placeholder="John" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-bold">Last Name</label>
                                            <input type="text" class="form-control bg-light border-0" placeholder="Doe" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Email Address</label>
                                        <input type="email" class="form-control bg-light border-0" placeholder="name@example.com" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Message</label>
                                        <textarea class="form-control bg-light border-0" rows="4" placeholder="How can we help?"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm fw-bold">Send Message</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-5 bg-dark">
        <div class="container px-5"><p class="m-0 text-center text-white">Copyright &copy; Remix Project 2026</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
